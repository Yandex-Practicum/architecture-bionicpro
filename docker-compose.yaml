version: '3.8'

services:

  ldap:
    image: osixia/openldap:1.5.0
    command: ["--copy-service"]
    environment:
      LDAP_ORGANISATION: BionicPRO
      LDAP_DOMAIN: example.com
      LDAP_ADMIN_PASSWORD: admin
      LDAP_TLS: "false"
    volumes:
      - ./ldap/config.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/50-bionicpro.ldif:ro
      - ldap-data:/var/lib/ldap
      - ldap-config:/etc/ldap/slapd.d

  keycloak_db:
    image: postgres:14
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - ./postgres-keycloak-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  keycloak:
    image: bionicpro-keycloak:21.1
    build:
      context: ./keycloak
      dockerfile: Dockerfile
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
      KC_HOSTNAME_URL: https://localhost:8443
      KC_HOSTNAME_ADMIN_URL: https://localhost:8443
      KC_PROXY: edge
      BIONICPRO_AUTH_CLIENT_SECRET: ${BIONICPRO_AUTH_CLIENT_SECRET:?Run scripts/setup-task3.sh
        first}
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD}
    command: 
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    depends_on:
      - keycloak_db
      - ldap

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
      - "8443:443"
    volumes:
      - ./.local/tls:/etc/nginx/tls:ro
    depends_on:
      bionicpro-auth:
        condition: service_healthy

  bionicpro-auth:
    build: ./bionicpro-auth
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
    environment:
      PUBLIC_ORIGIN: https://localhost:8443
      KEYCLOAK_ISSUER: https://localhost:8443/realms/reports-realm
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080/realms/reports-realm
      BIONICPRO_AUTH_CLIENT_SECRET: ${BIONICPRO_AUTH_CLIENT_SECRET:?Run scripts/setup-task3.sh
        first}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?Run scripts/setup-task3.sh first}
      REPORTS_API_URL: http://reports-api:8000
      PROFILE_DB: /data/yandex-profiles.sqlite3
      REPORTS_CDN_URL: http://reports-cdn:8080
      NO_PROXY: localhost,127.0.0.1,keycloak,reports-api,reports-cdn
      no_proxy: localhost,127.0.0.1,keycloak,reports-api,reports-cdn
    depends_on:
      - keycloak
    volumes:
    - profile-data:/data

  source-db:
    image: postgres:14
    environment:
      POSTGRES_DB: telemetry
      POSTGRES_USER: telemetry
      POSTGRES_PASSWORD: telemetry_demo
    volumes:
      - reports-source-data:/var/lib/postgresql/data
      - ./airflow/fixtures/postgres.sql:/docker-entrypoint-initdb.d/01-telemetry.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry -d telemetry"]
      interval: 5s
      timeout: 3s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: reports
      CLICKHOUSE_USER: reports
      CLICKHOUSE_PASSWORD: reports_demo
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - reports-clickhouse-data:/var/lib/clickhouse
      - ./airflow/clickhouse/config.xml:/etc/clickhouse-server/config.d/teaching.xml:ro
    ports:
      - "127.0.0.1:8123:8123"
    healthcheck:
      test:
        - CMD-SHELL
        - clickhouse-client --user reports --password reports_demo --query 'SELECT 1' >/dev/null
      interval: 5s
      timeout: 5s
      retries: 20

  airflow:
    image: apache/airflow:2.10.5-python3.11
    command: standalone
    environment:
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: airflow_demo

      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Europe/Moscow
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "15"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"

      CRM_SOURCE: ${CRM_SOURCE:-fixture}
      CRM_FIXTURE_PATH: /opt/airflow/fixtures/crm.json
      CRM_WEBHOOK_URL: ${CRM_WEBHOOK_URL:-}
      CRM_USER_ID_FIELD: ${CRM_USER_ID_FIELD:-UF_CRM_KEYCLOAK_SUB}
      CRM_PROSTHESIS_IDS_FIELD: ${CRM_PROSTHESIS_IDS_FIELD:-UF_CRM_PROSTHESIS_IDS}

      TELEMETRY_DSN: postgresql://telemetry:telemetry_demo@source-db:5432/telemetry

      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: reports
      CLICKHOUSE_PASSWORD: reports_demo

      NO_PROXY: localhost,127.0.0.1,source-db,clickhouse
      no_proxy: localhost,127.0.0.1,source-db,clickhouse
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./airflow/sql:/opt/airflow/sql:ro
      - ./airflow/fixtures:/opt/airflow/fixtures:ro
      - reports-airflow-data:/opt/airflow
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      source-db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  reports-api:
    build:
      context: ./reports-api
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: reports
      CLICKHOUSE_PASSWORD: reports_demo

      KEYCLOAK_ISSUER: https://localhost:8443/realms/reports-realm
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/reports-realm/protocol/openid-connect/certs
      
      NO_PROXY: localhost,127.0.0.1,clickhouse,keycloak,minio
      no_proxy: localhost,127.0.0.1,clickhouse,keycloak,minio

      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: reports
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      clickhouse:
        condition: service_healthy

  minio:
    image: bitnamilegacy/minio:2025.4.22-debian-12-r1
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_DEFAULT_BUCKETS: reports
    volumes:
      - reports-minio-data:/bitnami/minio/data
    ports:
      - "127.0.0.1:9001:9001"

  reports-cdn:
    image: nginx:stable-alpine
    volumes:
      - ./nginx/cdn.conf:/etc/nginx/conf.d/default.conf:ro
      - reports-cdn-cache:/var/cache/nginx
    depends_on:
      - minio

  crm-db:
    image: postgres:14
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_demo
    volumes:
      - crm-db-data:/var/lib/postgresql/data
      - ./debezium/crm-init.sql:/docker-entrypoint-initdb.d/01-crm.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_user -d crm"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.0
    user: "0:0"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - crm-kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 20

  kafka-connect:
    image: quay.io/debezium/connect:3.0.0.Final
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: bionicpro-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses

      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1

      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"

      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    ports:
      - "127.0.0.1:8083:8083"
    depends_on:
      crm-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  ldap-data: null
  ldap-config: null
  profile-data: null
  reports-source-data:
  reports-clickhouse-data:
  reports-airflow-data:
  reports-minio-data:
  reports-cdn-cache:
  crm-db-data:
  crm-kafka-data:
