services:
  keycloak_db:
    image: postgres:14
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - ./postgres-keycloak-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U keycloak_user -d keycloak_db" ]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:21.1
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
      KC_HOSTNAME_URL: http://localhost:8080
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
    command: 
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
      - ./keycloak/providers:/opt/keycloak/providers
    ports:
      - "8080:8080"
    depends_on:
      keycloak_db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8000

  bionicpro-auth:
    build: ./bionicpro-auth
    ports:
      - "8000:8080"
    environment:
      KC_URL_INTERNAL: http://keycloak:8080
      KC_URL_PUBLIC: http://localhost:8080
      KC_REALM: reports-realm
      KC_CLIENT_ID: bionicpro-auth
      KC_SECRET: sp3X9f9UYWQXkN2KzSKJ7ZdLJVWDcVwg+
      KC_ACCESS_TOKEN_LIFESPAN: 120
      FRONTEND_URL: http://localhost:3000
      SESSION_COOKIE_NAME: bff_session
      SESSION_TTL_SECONDS: 1800
      REPORTS_API_URL: http://reports-api:8080
      # для получения логов сессии
      Logging__LogLevel__bionicpro_auth: Debug


  reports-api:
    build: ./reports-api
    ports:
      - "8001:8080"
    environment:
      Keycloak__MetadataAddress: http://keycloak:8080/realms/reports-realm/.well-known/openid-configuration
      Keycloak__Issuer: http://localhost:8080/realms/reports-realm
      ClickHouse__Url: http://clickhouse:8123
      ClickHouse__User: default
      ClickHouse__Password: clickhouse
      S3__ServiceUrl: http://garage:3900
      S3__AccessKey: GK5e77ac0c3ee479e35d5c430136f10deb
      S3__SecretKey: 1c5f65021fdb14abf6cf0f7a460d29bd
      S3__Bucket: reports
      Cdn__BaseUrl: http://localhost:8082/reports
    depends_on:
      - keycloak
      - clickhouse

  openldap:
    image: osixia/openldap:1.5.0
    container_name: openldap
    environment:
      LDAP_ORGANISATION: "BionicPRO"
      LDAP_DOMAIN: "example.com"
      LDAP_ADMIN_PASSWORD: admin
      LDAP_REMOVE_CONFIG_AFTER_SETUP: "false"
    volumes:
      - ./ldap:/container/service/slapd/assets/config/bootstrap/ldif/custom
    ports:
      - "389:389"



  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse

  crm-db:
    image: postgres:14
    command: postgres -c wal_level=logical
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
    volumes:
      - ./crm-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 5s
      timeout: 3s
      retries: 10

  telemetry-db:
    image: postgres:14
    command: postgres -c wal_level=logical
    environment:
      POSTGRES_DB: telemetry
      POSTGRES_USER: telemetry
      POSTGRES_PASSWORD: telemetry
    volumes:
      - ./telemetry-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry -d telemetry"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  cdc:
    image: debezium/connect:2.7.3.Final
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: debezium
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    depends_on:
      kafka:
        condition: service_healthy

  cdc-init:
    image: curlimages/curl:8.10.1
    depends_on:
      - cdc
    restart: "no"
    volumes:
      - ./connectors:/connectors:ro
    entrypoint: [ /bin/sh, -eu, -c ]
    command:
      - |
        echo "Ожидание Kafka Connect..."
        for i in $$(seq 1 30); do
          if curl -sf http://cdc:8083/ > /dev/null; then break; fi
          sleep 2
        done

        curl -sf -X PUT \
          -H "Content-Type: application/json" \
          --data @/connectors/crm-connector.json \
          http://cdc:8083/connectors/crm-connector/config

        echo "Коннектор crm-connector зарегистрирован"

  airflow:
    build: ./airflow
    command: standalone
    ports:
      - "8081:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      AIRFLOW_CONN_CRM_DB: postgresql://crm:crm@crm-db:5432/crm
      AIRFLOW_CONN_TELEMETRY_DB: postgresql://telemetry:telemetry@telemetry-db:5432/telemetry
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse
      S3_ENDPOINT_URL: http://garage:3900
      S3_ACCESS_KEY: GK5e77ac0c3ee479e35d5c430136f10deb
      S3_SECRET_KEY: 1c5f65021fdb14abf6cf0f7a460d29bd
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    volumes:
      - ./airflow-dags:/opt/airflow/dags
    depends_on:
      crm-db:
        condition: service_healthy
      telemetry-db:
        condition: service_healthy
      clickhouse:
        condition: service_started

  telemetry-gen:
    build: ./telemetry-gen
    restart: unless-stopped
    environment:
      TELEMETRY_DB_CONN: postgresql://telemetry:telemetry@telemetry-db:5432/telemetry
    depends_on:
      telemetry-db:
        condition: service_healthy

  garage:
    image: dxflrs/garage:v2.5.0
    command: /garage server --single-node --default-bucket
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: GK5e77ac0c3ee479e35d5c430136f10deb
      GARAGE_DEFAULT_SECRET_KEY: 1c5f65021fdb14abf6cf0f7a460d29bd
      GARAGE_DEFAULT_BUCKET: reports
    ports:
      - "3900:3900"   # S3 API
      - "3902:3902"   # website endpoint для CDN
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data

  garage-init:
    image: alpine:3.21
    depends_on:
      - garage
    network_mode: service:garage
    pid: service:garage
    restart: "on-failure:5"
    entrypoint: [ /bin/sh, -eu, -c ]
    command:
      - |
        G="chroot /proc/1/root /garage -c /etc/garage.toml"

        for i in $$(seq 1 20); do
          if $$G node id -q 2>/dev/null; then break; fi
          echo "Ожидание Garage RPC... ($$i/20)"
          sleep 3
        done

        $$G bucket website --allow reports
        echo "website access включен для бакета reports"

  cdn:
    image: nginx:1.27
    ports:
      - "8082:80"
    volumes:
      - ./cdn/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      garage-init:
        condition: service_completed_successfully

volumes:
  garage-meta:
  garage-data:
  kafka-data: