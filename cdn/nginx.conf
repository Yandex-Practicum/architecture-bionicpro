proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=cdn:50m inactive=30m max_size=1g;

server {
    listen 80;

    location /reports/ {
        proxy_pass http://garage:3902/;
        proxy_set_header Host reports.web.garage;
        proxy_cache cdn;
        proxy_cache_key $uri;
        proxy_cache_valid 200 10m;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header Access-Control-Allow-Origin "*" always;
    }
}