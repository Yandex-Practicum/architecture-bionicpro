server {
    listen 3000;
    return 302 https://localhost:8443$request_uri;
}
server {
    listen 443 ssl;
    server_name localhost;
    ssl_certificate /etc/nginx/tls/localhost.crt;
    ssl_certificate_key /etc/nginx/tls/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Referrer-Policy no-referrer always;
    location ~ ^/(auth|api|cdn)/ {
        access_log off;
        proxy_pass http://bionicpro-auth:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location ~ ^/(realms|resources|admin)/ {
        access_log off;
        proxy_pass http://keycloak:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 8443;
    }
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}